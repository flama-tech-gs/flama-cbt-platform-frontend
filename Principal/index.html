<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Principal Login</title>

    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <div class="login-page">
      <!-- Logo -->

      <div class="login-brand">
        <img src="./assets/logo.png" alt="School Logo" class="school-logo" />

        <h1>Mobayo Academic</h1>

        <p>...Knowledge, Discipline, Excellence...</p>
      </div>

      <!-- Login Card -->

      <div class="login-card">
        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>

            <input
              type="email"
              id="email"
              placeholder="e.g principal@mobayoacademic.edu"
            />
          </div>

          <div class="form-group">
            <label>Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                placeholder="enter password"
              />

              <button type="button" id="togglePassword">
                <i data-lucide="eye-off"></i>
              </button>
            </div>

            <small> Minimum 8 characters. </small>
          </div>

          <div class="forgot-password">
            <a href="#"> Forget password? </a>
          </div>

          <button class="btn-primary" type="submit">
            Login

            <i data-lucide="arrow-right"></i>
          </button>
        </form>
      </div>

      <!-- Footer -->

      <p class="portal-note">
        ....Principal Portal — Access restricted to authorized school
        administrators only...
      </p>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="./js/login.js"></script>
  </body>
</html>
